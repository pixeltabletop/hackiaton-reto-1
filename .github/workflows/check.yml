name: check

on:
  push:
  pull_request:

jobs:
  motor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Corpus, evidencia y motor
        run: npm test
      - name: Puerta de calidad del dictamen
        run: npm run check:decision
      - name: Informes trampa (aprobaciones indebidas y regresiones)
        run: npm run check:trampas
